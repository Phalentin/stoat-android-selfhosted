name: Build debug APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
      
      - name: Create build properties
        run: cp stoatbuild.properties.example stoatbuild.properties
        
      - name: Build
        run: ./gradlew assembleDebug --no-daemon
        env:
          RVX_DEBUG_APP_NAME: "Stoat Self-Hosted"
          RVX_BUILD_FLAVOUR_ID: "selfhosted"
          RVX_APPLINK_HOST: "example.com"
          RVX_SENTRY_DSN: ""

      - uses: actions/upload-artifact@v4
        with:
          name: stoat-debug-apk
          path: app/build/outputs/apk/**/*.apk
